# ── HealthCore — Docker Compose ─────────────────────────────────────────
# Orquestación para desarrollo: arranca toda la plataforma con
#   docker compose up
# desde la raíz del repositorio.
#
# Servicios:
#   uis              → Frontends: website (Next.js, :3000) + backoffice (Next.js, :3001)
#   backend          → HealthCore API (FastAPI, :8000)
#   incidents-backend → Incidents API (FastAPI, :8010)
#   redis            → Celery broker (Redis, :6379)
#   flower           → Celery monitor (Flower, :5555)
#
# Red: healthcore-net (definida explícitamente)
#   Todos los servicios se comunican por nombre Docker, no por localhost.
#
# Variables: se cargan desde .env (raíz). No hay secretos hardcodeados aquí.

services:

  # ── Interfaces (website + backoffice) ────────────────────────────────
  uis:
    build:
      context: .
      dockerfile: uis/Dockerfile
    container_name: healthcore-uis
    hostname: uis
    ports:
      - "${SERVICE_WEBSITE_PORT:-3000}:${SERVICE_WEBSITE_PORT:-3000}"
      - "${SERVICE_BACKOFFICE_PORT:-3001}:${SERVICE_BACKOFFICE_PORT:-3001}"
    env_file:
      - .env
    environment:
      # Los puertos sobre los que escucha el script start.sh dentro del contenedor
      SERVICE_WEBSITE_PORT: "${SERVICE_WEBSITE_PORT:-3000}"
      SERVICE_BACKOFFICE_PORT: "${SERVICE_BACKOFFICE_PORT:-3001}"
      # Next.js dev no expone en 0.0.0.0 por defecto; forzamos escucha global
      HOSTNAME: "0.0.0.0"
    volumes:
      # Bind mount del código fuente para recarga en caliente
      - ./uis:/workspace/uis
      - ./src:/workspace/uis/backoffice/src
      - ./packages:/workspace/packages
      # Excluir node_modules del host (usamos las del contenedor)
      - /workspace/uis/website/node_modules
      - /workspace/uis/backoffice/node_modules
    networks:
      - healthcore-net
    restart: unless-stopped
    # start.sh arranca ambos Next.js en segundo plano dentro del contenedor
    command: ["start.sh"]

  # ── HealthCore API (FastAPI — puerto 8000) ──────────────────────────
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: healthcore-backend
    hostname: backend
    ports:
      - "${SERVICE_BACKEND_PORT:-8000}:${SERVICE_BACKEND_PORT:-8000}"
    env_file:
      - .env
    environment:
      SERVICE_NAME: "api"
      PORT: "${SERVICE_BACKEND_PORT:-8000}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    volumes:
      # Bind mount del código fuente para recarga en caliente
      - ./services:/workspace/services
      - ./data:/workspace/data
    depends_on:
      redis:
        condition: service_started
    networks:
      - healthcore-net
    restart: unless-stopped

  # ── Incidents API (FastAPI — puerto 8010) ────────────────────────────
  incidents-backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: healthcore-incidents-backend
    hostname: incidents-backend
    ports:
      - "${SERVICE_INCIDENTS_PORT:-8010}:${SERVICE_INCIDENTS_PORT:-8010}"
    env_file:
      - .env
    environment:
      SERVICE_NAME: "incidents-api"
      PORT: "${SERVICE_INCIDENTS_PORT:-8010}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    volumes:
      # Bind mount del código fuente para recarga en caliente
      - ./services:/workspace/services
      - ./data:/workspace/data
    depends_on:
      redis:
        condition: service_started
    networks:
      - healthcore-net
    restart: unless-stopped

  # ── Redis (Broker de mensajería para Celery) ────────────────────────
  # Actúa como broker y result backend. Política noeviction para no perder
  # mensajes de la cola aunque se alcance el límite de memoria.
  redis:
    image: redis:7-alpine
    container_name: healthcore-redis
    hostname: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks:
      - healthcore-net
    restart: unless-stopped

  # ── Flower (Monitor de Celery) ──────────────────────────────────────
  # Interfaz web para inspeccionar colas, workers y tareas en tiempo real.
  flower:
    image: mher/flower:2.0
    container_name: healthcore-flower
    hostname: flower
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      CELERY_BROKER_URL: "${REDIS_URL:-redis://redis:6379/0}"
      FLOWER_PORT: "${FLOWER_PORT:-5555}"
    depends_on:
      - redis
    networks:
      - healthcore-net
    restart: unless-stopped

  # ── Celery Worker ───────────────────────────────────────────────────
  # Proceso independiente que consume tareas de la cola. Corre con
  # recarga automática para desarrollo (--autoreload).
  celery-worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: healthcore-celery-worker
    hostname: celery-worker
    env_file:
      - .env
    environment:
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      PYTHONPATH: "/workspace"
    volumes:
      - ./services:/workspace/services
      - ./data:/workspace/data
    depends_on:
      redis:
        condition: service_started
    networks:
      - healthcore-net
    restart: unless-stopped
    working_dir: /workspace
    command: >
      celery -A services.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=100
      --without-gossip
      --without-mingle
      --without-heartbeat
      -E

networks:
  healthcore-net:
    name: healthcore-net
    driver: bridge

volumes:
  redis-data:
    driver: local