# ── HealthCore — Docker Compose ─────────────────────────────────────────
# Orquestación para desarrollo: arranca toda la plataforma con
#   docker compose up
# desde la raíz del repositorio.
#
# Servicios:
#   uis              → Frontends: website (Next.js, :3000) + backoffice (Next.js, :3001)
#   backend          → HealthCore API (FastAPI, :8000)
#   incidents-backend → Incidents API (FastAPI, :8010)
#
# Red: healthcore-net (definida explícitamente)
#   Todos los servicios se comunican por nombre Docker, no por localhost.
#
# Variables: se cargan desde .env (raíz). No hay secretos hardcodeados aquí.

services:

  # ── Interfaces (website + backoffice) ────────────────────────────────
  uis:
    build:
      context: .
      dockerfile: uis/Dockerfile
    container_name: healthcore-uis
    hostname: uis
    ports:
      - "${SERVICE_WEBSITE_PORT:-3000}:${SERVICE_WEBSITE_PORT:-3000}"
      - "${SERVICE_BACKOFFICE_PORT:-3001}:${SERVICE_BACKOFFICE_PORT:-3001}"
    env_file:
      - .env
    environment:
      # Los puertos sobre los que escucha el script start.sh dentro del contenedor
      SERVICE_WEBSITE_PORT: "${SERVICE_WEBSITE_PORT:-3000}"
      SERVICE_BACKOFFICE_PORT: "${SERVICE_BACKOFFICE_PORT:-3001}"
      # Next.js dev no expone en 0.0.0.0 por defecto; forzamos escucha global
      HOSTNAME: "0.0.0.0"
    volumes:
      # Bind mount del código fuente para recarga en caliente
      - ./uis:/workspace/uis
      - ./src:/workspace/uis/backoffice/src
      - ./packages:/workspace/packages
      # Excluir node_modules del host (usamos las del contenedor)
      - /workspace/uis/website/node_modules
      - /workspace/uis/backoffice/node_modules
    networks:
      - healthcore-net
    restart: unless-stopped
    # start.sh arranca ambos Next.js en segundo plano dentro del contenedor
    command: ["start.sh"]

  # ── HealthCore API (FastAPI — puerto 8000) ──────────────────────────
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: healthcore-backend
    hostname: backend
    ports:
      - "${SERVICE_BACKEND_PORT:-8000}:${SERVICE_BACKEND_PORT:-8000}"
    env_file:
      - .env
    environment:
      SERVICE_NAME: "api"
      PORT: "${SERVICE_BACKEND_PORT:-8000}"
    volumes:
      # Bind mount del código fuente para recarga en caliente
      - ./services:/workspace/services
      - ./data:/workspace/data
    networks:
      - healthcore-net
    restart: unless-stopped

  # ── Incidents API (FastAPI — puerto 8010) ────────────────────────────
  incidents-backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: healthcore-incidents-backend
    hostname: incidents-backend
    ports:
      - "${SERVICE_INCIDENTS_PORT:-8010}:${SERVICE_INCIDENTS_PORT:-8010}"
    env_file:
      - .env
    environment:
      SERVICE_NAME: "incidents-api"
      PORT: "${SERVICE_INCIDENTS_PORT:-8010}"
    volumes:
      # Bind mount del código fuente para recarga en caliente
      - ./services:/workspace/services
      - ./data:/workspace/data
    networks:
      - healthcore-net
    restart: unless-stopped

networks:
  healthcore-net:
    name: healthcore-net
    driver: bridge