[project]
name = "healthcore-sales-forecast"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "celery>=5.7.0",
    "fastapi>=0.162.4",
    "fastmcp>=1.0.0",
    "flower>=2.2.0",
    # langchain-mcp-adapters: convierte tools MCP a BaseTool de LangChain.
    # Se usa en services/agent/tools/mcp_client.py para que el agente LangGraph
    # consuma las tools del MCP Server vía langchain-mcp-adapters.load_mcp_tools.
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.22",
    "libpass>=1.9.4",
    "matplotlib>=3.11.2",
    "mcp>=1.24.0,<2",
    "mcpauth>=0.1.0",
    "openai>=3.49.0",
    "pandas>=3.1.0",
    "psycopg>=3.3.9",
    "psycopg2-binary>=2.9.13",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.50",
    "tinydb>=4.9.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
